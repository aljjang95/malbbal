<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0B0C" />
  <meta name="description" content="90초 한국어 말빨 훈련. 면접, 거절, 가격, 소개팅, 사과, 발표 — 한 판씩 섭니다." />
  <title>말빨 길러드립니다</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="lamp" aria-hidden="true"></div>

  <main id="app">
    <section id="screen-landing" class="screen is-on" data-screen="landing">
      <p class="eyebrow">보컬 · 스피치 도장</p>
      <h1 class="display">말빨<br />길러드립니다</h1>
      <p class="promise">90초. 한 판. 말이 서지 않으면 자리가 무너집니다.</p>
      <button type="button" class="cta" id="btn-enter">판 들어가기</button>
      <p class="legal">연습용 로컬 처리, 서버로 음성 안 보냄.</p>
    </section>

    <section id="screen-pick" class="screen" data-screen="pick" hidden>
      <header class="top">
        <button type="button" class="text-btn" id="btn-pick-back">뒤로</button>
        <p class="eyebrow">오늘 설 자리</p>
      </header>
      <h2 class="screen-title">판을 고르십시오</h2>
      <div id="board" class="board"></div>
    </section>

    <section id="screen-round" class="screen" data-screen="round" hidden>
      <header class="top top-split">
        <button type="button" class="text-btn" id="btn-round-quit">나가기</button>
        <p class="eyebrow" id="round-label">판</p>
        <p class="timer" id="timer" aria-live="polite">20</p>
      </header>

      <div class="opponent">
        <p class="opponent-who">상대</p>
        <p class="opponent-line" id="opponent-line"></p>
        <button type="button" class="text-btn" id="btn-speak">다시 듣기</button>
      </div>

      <div class="stage">
        <div class="record-zone" id="record-zone">
          <button type="button" id="btn-record" class="record is-idle" aria-label="누르고 말하기">
            <span class="record-ring" aria-hidden="true"></span>
            <span class="record-core" aria-hidden="true"></span>
          </button>
          <p class="record-label" id="record-label">누르고 말하기</p>
          <p class="hint" id="record-hint">누르는 동안만 녹음됩니다</p>
        </div>

        <div id="fallback" class="fallback" hidden>
          <p class="fallback-label">폴백 · 마이크 없이 타이핑</p>
          <label class="sr" for="typed">답변 입력</label>
          <textarea id="typed" rows="5" placeholder="이 자리에 설 말을 적으십시오."></textarea>
          <button type="button" class="cta cta-sm" id="btn-submit-typed">제출하기</button>
        </div>
      </div>
    </section>

    <section id="screen-result" class="screen" data-screen="result" hidden>
      <header class="top">
        <p class="eyebrow" id="result-label">채점</p>
      </header>
      <h2 class="screen-title">말의 뼈</h2>
      <p class="coach" id="coach"></p>

      <ul class="axes" id="axes"></ul>

      <div class="stats">
        <div class="stat">
          <span class="stat-k">군더더기</span>
          <strong class="stat-v" id="stat-filler">0</strong>
        </div>
        <div class="stat">
          <span class="stat-k">WPM</span>
          <strong class="stat-v" id="stat-wpm">—</strong>
        </div>
        <div class="stat">
          <span class="stat-k">최장 침묵</span>
          <strong class="stat-v" id="stat-pause">—</strong>
        </div>
      </div>

      <div class="result-grid">
        <div class="block">
          <p class="block-label">인식된 말</p>
          <p class="transcript" id="transcript"></p>
        </div>
        <div class="block block-rewrite">
          <p class="block-label">다시 서는 첫 문장</p>
          <p class="rewrite" id="rewrite"></p>
        </div>
      </div>

      <div class="block" id="playback-wrap" hidden>
        <p class="block-label">본인 녹음</p>
        <audio id="playback" controls playsinline></audio>
      </div>

      <div class="cta-row">
        <button type="button" class="cta" id="btn-again">한 판 더</button>
        <button type="button" class="ghost" id="btn-other">다른 판</button>
      </div>
      <p class="legal">연습용 로컬 처리, 서버로 음성 안 보냄.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
